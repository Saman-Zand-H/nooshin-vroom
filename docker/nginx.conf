server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 60m;

    location /api/ {
        # Resolve through Docker's embedded DNS so a recreated backend
        # container is picked up instead of proxying to its old IP forever.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        # Preserve the port so loopback Spotify callbacks can match exactly.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Spotify-Host $http_x_spotify_host;
        proxy_read_timeout 120s;
    }

    location /media/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
