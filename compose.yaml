services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:${FRONTEND_PORT:-5174},http://127.0.0.1:${FRONTEND_PORT:-5174}}
      APP_URL: ${APP_URL:?Set APP_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-disable}
      DJANGO_COOKIE_SECURE: ${DJANGO_COOKIE_SECURE:-false}
      DJANGO_COOKIE_SAMESITE: ${DJANGO_COOKIE_SAMESITE:-Lax}
      DJANGO_CSRF_SAMESITE: ${DJANGO_CSRF_SAMESITE:-Lax}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-0}
      DJANGO_SSL_REDIRECT: ${DJANGO_SSL_REDIRECT:-false}
      DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:-room@localhost}
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      SPOTIFY_REDIRECT_URIS: ${SPOTIFY_REDIRECT_URIS:-}
      SPOTIFY_TOKEN_KEY: ${SPOTIFY_TOKEN_KEY:-}
      JAMENDO_CLIENT_ID: ${JAMENDO_CLIENT_ID:-}
      IMDB_WATCHLIST_QUERY_HASH: ${IMDB_WATCHLIST_QUERY_HASH:-}
      IMDB_WATCHLIST_ENABLED: ${IMDB_WATCHLIST_ENABLED:-true}
      # Optional egress proxy for networks without direct internet; empty means direct.
      HTTP_PROXY: ${BACKEND_HTTP_PROXY:-}
      HTTPS_PROXY: ${BACKEND_HTTP_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,db
    depends_on:
      db:
        condition: service_healthy
    command:
      ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn controlroom.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"]
    volumes:
      - room-media:/app/backend/media
    expose:
      - "8000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_DJANGO_SAME_ORIGIN: "true"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
  room-media:

networks:
  default:
    name: control-room
    ipam:
      config:
        - subnet: 10.250.0.0/16
