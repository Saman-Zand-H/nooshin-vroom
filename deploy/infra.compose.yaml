services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - control-room

volumes:
  caddy-data:
  caddy-config:

networks:
  control-room:
    external: true
    name: control-room
